name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="MadarsaApp_Supabase_Connected.zip"

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q "$ZIP_FILE" -d .project_extract

          echo "Extracted project:"
          find .project_extract -maxdepth 3 -type f | sort

          shopt -s dotglob
          cp -a .project_extract/. .

          rm -rf .project_extract
          rm -f local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: madarsa-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"