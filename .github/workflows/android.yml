name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="MadarsaApp_Supabase_Connected.zip"

          rm -rf .project_extract
          mkdir -p .project_extract

          unzip -q "$ZIP_FILE" -d .project_extract

          PROJECT_DIR=""

          while IFS= read -r gradlew_file; do
            PROJECT_DIR="$(dirname "$gradlew_file")"
            break
          done < <(find .project_extract -type f -name gradlew)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project root not found."
            find .project_extract -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Project root: $PROJECT_DIR"

          shopt -s dotglob
          cp -a "$PROJECT_DIR"/. .

          rm -rf .project_extract
          rm -f local.properties

      - name: Commit extracted Android source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "Extract Android project source"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: madarsa-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"